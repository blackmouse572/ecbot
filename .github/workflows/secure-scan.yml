name: SecurePR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Semgrep diffs against the base branch to gate on new findings only.
          fetch-depth: 0

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: table
          output: trivy-results.txt
          exit-code: 0

      - name: Install Semgrep
        run: pip install semgrep==1.177.0

      - name: Run Semgrep
        run: semgrep scan --config p/default --output semgrep-results.txt

      - name: Generate PR summary
        run: |
          chmod +x .github/summary-generator.sh
          .github/summary-generator.sh

      - name: Upload scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-scan-report
          path: summary.md

      # The steps above only report. The steps below fail the PR on what it
      # adds: a fixable HIGH or CRITICAL vulnerability or a committed secret
      # that the base branch does not have, and any new Semgrep finding.
      # Findings already on the base branch are left to Dependabot.
      - name: Check out the base branch for comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trivy-base

      - name: Scan the PR for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .trivy-base
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-head.json
          exit-code: 0

      - name: Scan the base branch for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .trivy-base
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-base.json
          exit-code: 0

      - name: Gate on vulnerabilities and secrets the PR adds
        run: |
          # One line per finding: package + advisory, or file + secret rule.
          keys() {
            jq -r '.Results[]? |
              (.Vulnerabilities[]? | "vuln \(.PkgName) \(.VulnerabilityID)"),
              (.Target as $t | .Secrets[]? | "secret \($t | sub("^\\.trivy-base/"; "")) \(.RuleID)")' "$1" | sort -u
          }
          keys trivy-base.json > base.txt
          keys trivy-head.json > head.txt
          comm -13 base.txt head.txt > added.txt
          if [ -s added.txt ]; then
            echo "::error::This PR adds HIGH/CRITICAL findings the base branch does not have:"
            cat added.txt
            exit 1
          fi
          echo "No new HIGH/CRITICAL vulnerabilities or secrets."

      # Keep the base copy out of the Semgrep scan below.
      - name: Remove the base branch copy
        if: always()
        run: rm -rf .trivy-base

      - name: Gate on new Semgrep findings
        env:
          BASE_REF: ${{ github.base_ref }}
        run: semgrep scan --config p/default --error --baseline-commit "origin/$BASE_REF"
