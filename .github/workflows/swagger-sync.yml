# .github/workflows/swagger-sync.yml
name: Swagger Sync

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/client/**"
      - "scripts/ci/swagger-sync.sh"
      - ".github/workflows/swagger-sync.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/client/**"
      - "scripts/ci/swagger-sync.sh"
      - ".github/workflows/swagger-sync.yml"

permissions:
  contents: read

jobs:
  swagger-sync:
    name: Swagger Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eccho
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Generate JWT keys
        run: pnpm --filter api run generate:keys generate keys

      - name: Verify @repo/client matches apps/api/swagger.json
        run: bash scripts/ci/swagger-sync.sh
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/eccho
          DATABASE_SSL: "false"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
