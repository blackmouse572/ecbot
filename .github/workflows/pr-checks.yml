name: PR Checks

# Local hooks can be skipped with --no-verify; these checks cannot.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # PRs are squash-merged, so the title becomes the commit on main.
  commitlint:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: commitlint.config.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | npx --yes \
            -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
            commitlint

  # Same check as the pre-commit hook: base64 decoded and run, curl piped to sh,
  # long base64 blobs. Runs on the lines this PR adds.
  suspicious-code:
    name: No hidden code
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      # The merge commit and its first parent (the base branch tip).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check added lines
        run: node scripts/hooks/check-suspicious.mjs HEAD^1 HEAD
