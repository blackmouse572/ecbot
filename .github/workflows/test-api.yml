name: Test API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # instrument.ts validates AppEnvDto at import time, so the unit suite
      # needs a bootable .env — the example plus generated keys is enough.
      - name: Prepare .env
        run: |
          cp apps/api/.env.example apps/api/.env
          pnpm --filter api run generate:keys generate keys

      - name: Test API
        run: pnpm run test:api
