name: Test API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    services:
      # Same image as the e2e lane: the migrations create the `vector`
      # extension themselves, so plain postgres is not enough.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eccho_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # instrument.ts validates AppEnvDto at import time, so the unit suite
      # needs a bootable .env — the example plus generated keys is enough.
      - name: Prepare .env
        run: |
          cp apps/api/.env.example apps/api/.env
          pnpm --filter api run generate:keys generate keys

      - name: Test API
        run: pnpm run test:api

      # `migration:up` rewrites .snapshot-neondb.json from the database it just
      # migrated, so on an empty database the committed snapshot and the
      # migrations must produce the same schema. `migration:check` then compares
      # the entities against that snapshot.
      - name: Migrate a clean database
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/eccho_ci
          DATABASE_SSL: "false"
        run: |
          pnpm migration:up
          pnpm migration:check

      - name: Schema snapshot must be unchanged
        run: |
          git diff --exit-code -- apps/api/migrations/ || {
            echo "::error::migration:up rewrote apps/api/migrations/.snapshot-neondb.json — entities, migrations and the snapshot disagree. See apps/api/docs/migration.md."
            exit 1
          }
