# .github/workflows/e2e.yml
name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/ai/**"
      - "apps/app/**"
      - "e2e/**"
      - "docker-compose*.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-regression:
    name: E2E Regression
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Prepare env files
        run: |
          cp apps/ai/.env.example apps/ai/.env
          cp apps/api/.env.example apps/api/.env
          cp apps/app/.env.example apps/app/.env

      - name: Generate JWT keys
        working-directory: apps/api
        run: pnpm run generate:keys generate keys

      - name: Generate ephemeral E2E keys
        run: |
          E2E_API_KEY="$(openssl rand -hex 10):$(openssl rand -hex 15)"
          echo "E2E_TEST_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_API_KEY=$E2E_API_KEY" >> "$GITHUB_ENV"
          # Seed-only name: E2E_API_KEY is already set from Secret Manager in deployed envs.
          echo "E2E_SEED_DEFAULT_API_KEY=$E2E_API_KEY" >> "$GITHUB_ENV"

      - name: Start services
        run: docker compose --profile full -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
        env:
          E2E_TEST_KEY: ${{ env.E2E_TEST_KEY }}
          AI_CASSETTE_MODE: none

      - name: Run DB migrations and seeds
        run: pnpm migration:up && pnpm migrate:seed:e2e
        working-directory: apps/api
        env:
          E2E_SEED_DEFAULT_API_KEY: ${{ env.E2E_SEED_DEFAULT_API_KEY }}
          DATABASE_URL: postgresql://postgres:password@localhost:5432/eccho_test
          DATABASE_SSL: "false"

      - name: Run regression E2E tests
        run: pnpm e2e
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8080
          AI_URL: http://localhost:8000
          E2E_TEST_KEY: ${{ env.E2E_TEST_KEY }}
          E2E_API_KEY: ${{ env.E2E_API_KEY }}
          AI_CASSETTE_MODE: none

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs
        if: failure()
        run: |
          docker compose --profile full -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          for c in $(docker ps -aq --filter "label=com.docker.compose.project=eccho-e2e"); do
            echo "--- healthcheck: $(docker inspect --format '{{.Name}}' "$c") ---"
            docker inspect --format '{{json .State.Health}}' "$c"
          done
          docker compose --profile full -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=1000

      - name: Teardown services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  e2e-smoke:
    name: E2E Smoke (real AI)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Prepare env files
        run: |
          cp apps/ai/.env.example apps/ai/.env
          cp apps/api/.env.example apps/api/.env
          cp apps/app/.env.example apps/app/.env

      - name: Generate JWT keys
        working-directory: apps/api
        run: pnpm run generate:keys generate keys

      - name: Generate ephemeral E2E keys
        run: |
          E2E_API_KEY="$(openssl rand -hex 10):$(openssl rand -hex 15)"
          echo "E2E_TEST_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_API_KEY=$E2E_API_KEY" >> "$GITHUB_ENV"
          # Seed-only name: E2E_API_KEY is already set from Secret Manager in deployed envs.
          echo "E2E_SEED_DEFAULT_API_KEY=$E2E_API_KEY" >> "$GITHUB_ENV"

      - name: Start services
        run: docker compose --profile full -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
        env:
          E2E_TEST_KEY: ${{ env.E2E_TEST_KEY }}
          AI_CASSETTE_MODE: live

      - name: Run DB migrations and seeds
        run: pnpm migration:up && pnpm migrate:seed:e2e
        working-directory: apps/api
        env:
          E2E_SEED_DEFAULT_API_KEY: ${{ env.E2E_SEED_DEFAULT_API_KEY }}
          DATABASE_URL: postgresql://postgres:password@localhost:5432/eccho_test
          DATABASE_SSL: "false"

      - name: Run smoke E2E tests
        run: pnpm e2e:smoke
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8080
          AI_URL: http://localhost:8000
          E2E_TEST_KEY: ${{ env.E2E_TEST_KEY }}
          E2E_API_KEY: ${{ env.E2E_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_CASSETTE_MODE: live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs
        if: failure()
        run: |
          docker compose --profile full -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          for c in $(docker ps -aq --filter "label=com.docker.compose.project=eccho-e2e"); do
            echo "--- healthcheck: $(docker inspect --format '{{.Name}}' "$c") ---"
            docker inspect --format '{{json .State.Health}}' "$c"
          done
          docker compose --profile full -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=1000

      - name: Teardown services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
