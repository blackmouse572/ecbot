name: Feature request
description: Propose a change to the engine
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and who is affected (operator, end customer, self-hoster).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. Point at the module (`apps/api/src/modules/…`, `apps/app/src/routes/…`, `apps/ai/…`) if you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
