# Three usage modes:
#   docker compose up                    infra only (redis/jwks/cloud-tasks) — dev runs api/app natively
#   docker compose --profile app up      infra + apis + app — functional testing, no ai
#   docker compose --profile full up     everything — self-hosting, and full test / deploy parity
# Services with no `profiles:` key are always on; profiles only add more.
#
# Run `pnpm setup:local` first. It writes the root .env this file reads
# (POSTGRES_PASSWORD, SITE_URL) and the keys jwks-server serves.
# Only `app` (the Caddy web server) listens on the network; every other port is
# bound to 127.0.0.1, so it is reachable from this machine only.

services:
  # Main API service
  apis:
    profiles: [app, full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    hostname: apis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Whole-dir bind mount only — individual per-file mounts on top of an
      # already-mounted dir risk Docker creating a phantom empty directory
      # if a key file is briefly missing at container creation.
      - ./apps/api/keys:/app/keys:ro
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    # .env's REDIS_HOST/AUTH_JWT_JWKS_URI/AI_BACKEND_URL point at
    # "localhost"/"0.0.0.0", which is correct for running the API natively
    # (docker ports map to host), but wrong from inside this very container
    # — that address there is the container itself, not the redis/
    # jwks-server/ai services. ioredis then retries a refused connection
    # forever instead of erroring, which reads as the whole request
    # hanging. Override just for this container.
    environment:
      REDIS_HOST: redis
      AUTH_JWT_JWKS_URI: http://jwks-server:80/.well-known/jwks.json
      AI_BACKEND_URL: http://ai:8000
      # Same reason as REDIS_HOST above: .env points DATABASE_URL at
      # localhost, which from inside this container is the container itself.
      # Only applies to the containerised api (`--profile app`); running the
      # api natively uses .env as-is, hosted Postgres included.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/eccho
      # .env's localhost bind would be unreachable from the `app` proxy.
      HTTP_HOST: 0.0.0.0
      # The browser reaches the app and the API on one origin through `app`.
      HOME_URL: ${SITE_URL:-http://localhost}
      API_BACKEND_URL: ${SITE_URL:-http://localhost}
      MIDDLEWARE_CORS_ORIGIN: ${SITE_URL:-http://localhost}
      # Must equal the redirect URIs baked into the app below.
      FACEBOOK_REDIRECT_URI: ${SITE_URL:-http://localhost}/auth/facebook/callback
      INSTAGRAM_REDIRECT_URI: ${SITE_URL:-http://localhost}/auth/instagram/callback
      ZALO_REDIRECT_URI: ${SITE_URL:-http://localhost}/auth/zalo/callback
      # Background jobs run through the emulator, which calls the API on this
      # network rather than through the public SITE_URL.
      CLOUD_TASKS_EMULATOR_HOST: cloud-tasks-emulator:8123
      CLOUD_TASKS_TARGET_URL: http://apis:8080
    networks:
      - app-network
    # ai is intentionally NOT a hard dependency — apis must still boot under
    # `--profile app` (no ai in scope). Chatbot streaming degrades gracefully
    # (5040) if ai isn't up; everything else doesn't need it.
    depends_on:
      redis:
        condition: service_healthy
      jwks-server:
        condition: service_healthy
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Applies pending migrations and adds the countries, roles and API keys the
  # API needs (migrate:bootstrap), then exits. `apis` waits for it, so a fresh
  # database is usable and an upgrade gets the new migrations before the new
  # API serves traffic.
  migrate:
    profiles: [app, full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    # The API key seed reads the pairs setup:local wrote here.
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/eccho
      # This is a migration job even when .env says production. cli.ts only
      # refuses seeds under production to keep demo data out, and bootstrap
      # runs none (no seed:user).
      APP_ENV: migration
    networks:
      - app-network
    depends_on:
      database:
        condition: service_healthy

  # Web server (Caddy): serves the app's production bundle and proxies /api to
  # `apis`, on SITE_URL. A domain gets a Let's Encrypt certificate on first
  # start, so its DNS must already point here and ports 80 and 443 be open.
  # The hosted product deploys the app to Cloudflare instead.
  app:
    profiles: [app, full]
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      target: web
      args:
        VITE_API_URL: ${SITE_URL:-http://localhost}
        VITE_FACEBOOK_REDIRECT_URI: ${SITE_URL:-http://localhost}/auth/facebook/callback
        VITE_INSTAGRAM_REDIRECT_URI: ${SITE_URL:-http://localhost}/auth/instagram/callback
        VITE_ZALO_REDIRECT_URI: ${SITE_URL:-http://localhost}/auth/zalo/callback
    hostname: app
    environment:
      SITE_ADDRESS: ${SITE_URL:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - apis
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # AI Service
  ai:
    profiles: [full]
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    hostname: ai
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./apps/ai/.env
    # Container-local overrides for the same localhost pitfall as `apis`.
    environment:
      POSTGRES_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/eccho
      API_BASE_URL: http://apis:8080
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    healthcheck:
      # python:3.12-slim has no curl binary — use the stdlib instead.
      # 127.0.0.1, not localhost: same ::1-vs-0.0.0.0 pitfall as jwks-server.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database (PostgreSQL + pgvector). Relational data and embeddings share one
  # database (apps/ai queries the same instance), so the plain `postgres` image
  # is not enough — the vector extension must be available for
  # 20260424000000_create_knowledge_item_chunks to create it.
  # The password comes from the root .env; `pnpm setup:local` generates it and
  # writes the same one into apps/api/.env's DATABASE_URL. Postgres only reads
  # it when the volume is first created, so changing it later needs ALTER USER.
  # Point DATABASE_URL elsewhere to use a hosted Postgres.
  database:
    image: pgvector/pgvector:pg17
    hostname: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run pnpm setup:local)}
      POSTGRES_DB: eccho
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eccho"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # JWKS Server for token validation
  jwks-server:
    image: nginx:alpine
    hostname: jwks-server
    # Fail with a clear message instead of serving 404s: without the keys from
    # `pnpm setup:local`, Docker mounts an empty directory here.
    command:
      - sh
      - -c
      - |
        test -f /usr/share/nginx/html/.well-known/jwks.json || {
          echo "apps/api/keys/jwks.json is missing. Run pnpm setup:local, then start Compose again."
          exit 1
        }
        exec nginx -g 'daemon off;'
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:80"
    volumes:
      # - ./apps/api/keys/jwks.json:/usr/share/nginx/html/.well-known/jwks.json
      # - ./apps/api/ci/jwks-server/jwks.conf:/etc/nginx/conf.d/default.conf
      - ./apps/api/keys:/usr/share/nginx/html/.well-known
      - ./apps/api/ci/jwks-server/jwks.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      # 127.0.0.1, not localhost — localhost resolves to ::1 first inside the
      # container, but nginx only listens on 0.0.0.0, so wget got "connection
      # refused" and the service always showed unhealthy despite working fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/.well-known/jwks.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    hostname: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5

  cloud-tasks-emulator:
    # Pinned by digest: `latest` renamed -queue to -initial-queue, and the
    # emulator exits 2 on an unknown flag, so whether this container lived
    # depended on how stale your local pull was.
    image: ghcr.io/aertje/cloud-tasks-emulator@sha256:a625499a689597d1c14efe33224c59e5e5a1e6b9bfbdfc52e978fad307c52ed3
    hostname: cloud-tasks-emulator
    command:
      - -host=0.0.0.0
      - -port=8123
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/email
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/sms
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/followup
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/knowledge-ingest
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/customer-tag-classifier
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/session
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/inbound-event
      - -initial-queue=projects/eccho-dev/locations/asia-southeast1/queues/conversation-memory
    # Tasks call API_BACKEND_URL. With the API running on the host, that is
    # http://host.docker.internal:8080, which Docker Desktop resolves but
    # Linux does not without this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

volumes:
  redis_data:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
