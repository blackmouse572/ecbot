name: Test
on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
            - development
        paths:
            - 'apps/api/**'
    push:
        branches:
            - main
            - development
        paths:
            - 'apps/api/**'

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: ['lts/*']

        steps:
            - name: Git checkout
              uses: actions/checkout@v4

            - name: Setup node version ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Unit Test
              run: pnpm test
              env:
                  CI: true
