[project]
name = "eccho-ai"
version = "0.1.0"
description = "Ecbot AI Service"
authors = []
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.135.1,<0.142.0",
    "uvicorn (>=0.41.0,<0.42.0)",
    "python-multipart>=0.0.31,<0.0.32",
    "langchain (>=1.3.0,<2.0.0)",
    "langchain-openai (>=1.2.1,<2.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.0.0,<4.0.0)",
    "async-lru (>=2.3.0,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "structlog>=26.1.0",
    "pypdf>=6.13.0",
    "python-docx>=1.2.0",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=5.6.0",
    "firecrawl-py>=4.30.3",
    "tenacity>=9.0.0",
    "pymupdf>=1.27.2.2",
    "selectolax>=0.4.7",
    "vcrpy>=6.0.1",
    # Direct imports previously satisfied only transitively (configs.variables / repos.ai).
    "pydantic-settings>=2.0.0",
]

[project.scripts]
eccho-ai = "eccho_ai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eccho_ai"]

[tool.uv]
# Installable src/ package; uv installs it editable into the environment.
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.0",
    "streamlit>=1.55.0",
]

[tool.pytest.ini_options]
# Async tests/fixtures are written without explicit markers — handle automatically.
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Live logging to console during runs.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "integration: needs a live Postgres or full app environment; excluded from the default CI unit lane (run the unit lane with `-m \"not integration\"`)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
